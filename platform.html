<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1119">
<title>Share Option</title>
<link rel="manifest" href="/manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style id="app-css">
@layer properties;@layer theme, base, components, utilities;
@layer theme {
  :root, :host {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue","Noto Sans", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --color-white: #fff;--spacing: 0.25rem;--container-sm: 24rem;--container-md: 28rem;--container-xl: 36rem;--container-2xl: 42rem;--container-3xl: 48rem;--container-6xl: 72rem;
    --text-xs: 0.75rem;--text-sm: 0.875rem;--text-base: 1rem;--text-lg: 1.125rem;--text-xl: 1.25rem;--text-2xl: 1.5rem;--text-3xl: 1.875rem;--text-4xl: 2.25rem;--text-5xl: 3rem;--text-6xl: 3.75rem;--text-7xl: 4.5rem;
    --font-weight-semibold: 600;--font-weight-bold: 700;--font-weight-extrabold: 800;--leading-tight: 1.25;--radius-lg: 0.5rem;
  }
}
@layer base {
  *, ::after, ::before { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
  html, body { background: #0c1119; color: #e8eef7; font-family: 'Manrope', sans-serif; }
  a { color: inherit; text-decoration: inherit; }
  button, input, select { font: inherit; color: inherit; background: transparent; }
}
@layer components {
  :root { --bg: #0c1119; --panel: #151d2b; --line: #243046; --text: #e8eef7; --dim: #8a99b0; --ok: #3fd08a; --gold: #f2b84b; --bad: #ff5c6c; }
  .glass { background: rgba(12,17,25,.78); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .panel { background: linear-gradient(180deg,var(--panel),#121a28); border: 1px solid var(--line); border-radius: 16px; }
  .dim { color: var(--dim); } .ok { color: var(--ok); } .bad { color: var(--bad); } .gold { color: var(--gold); }
  .btn { display: inline-flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 11px; padding: .65rem 1.1rem; cursor: pointer; background: var(--gold); color: #1b1405; border: none; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.glow { background: rgba(242,184,75,.07); color: var(--gold); border: 1px solid rgba(242,184,75,.55); }
  input, select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: .65rem .8rem; color: var(--text); }
  .fl { position: relative; margin-bottom: 1rem; }
  .fl input { padding: 1.25rem .9rem .4rem; }
  .fl label { position: absolute; left: .9rem; top: .85rem; color: var(--dim); pointer-events: none; transition: all .15s; font-size: .85rem; }
  .fl input:focus + label, .fl input:not(:placeholder-shown) + label { top: .3rem; font-size: .65rem; color: var(--gold); }
}
</style>
</head>
<body>

<header class="glass sticky top-0 z-40" style="padding: 0.8rem 1rem;">
  <div style="max-width: 1150px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
    <a href="#/" style="display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.1rem;">
      <span style="background:var(--gold); color:#1b1405; width:32px; height:32px; display:grid; place-items:center; border-radius:8px;">S</span>
      Share Option
    </a>
    <div style="display: flex; gap: 0.5rem;">
      <button onclick="showAuthModal('login')" class="btn ghost" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Sign in</button>
      <button onclick="showAuthModal('register')" class="btn glow" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Create account</button>
    </div>
  </div>
</header>

<div id="alertBox" style="display:none; text-align:center; padding:0.6rem; background:rgba(255,92,108,.15); color:var(--bad); font-size:0.85rem;"></div>

<main style="max-width: 1150px; margin: 0 auto; padding: 3rem 1rem;">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; align-items: center;">
    <div>
      <h1 style="font-size: 2.8rem; font-weight: 800; line-height: 1.1;">Your signals, your broker, your rules.</h1>
      <p style="color: var(--dim); margin-top: 1rem; font-size: 1.05rem;">
        Signals straight to your Pocket Option, Quotex, or IQ Option account. Fees are charged only on realized profit after withdrawal.
      </p>
      <div style="margin-top: 2rem; display: flex; gap: 1rem;">
        <button onclick="showAuthModal('register')" class="btn" style="padding: 0.8rem 1.5rem;">Create free account</button>
        <button onclick="showAuthModal('login')" class="btn ghost" style="padding: 0.8rem 1.5rem;">Sign in</button>
      </div>
    </div>

    <!-- Auth Form Container -->
    <div id="authContainer" class="panel" style="padding: 2rem;">
      <h2 id="authTitle" style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Create your account</h2>
      
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div id="nameField" class="fl">
          <input type="text" id="fullName" placeholder=" " />
          <label for="fullName">Full name</label>
        </div>

        <div class="fl">
          <input type="email" id="email" required placeholder=" " />
          <label for="email">Email address</label>
        </div>

        <div class="fl">
          <input type="password" id="password" required placeholder=" " />
          <label for="password">Password (8+ characters)</label>
        </div>

        <div id="authError" style="color: var(--bad); font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>

        <button type="submit" id="submitBtn" class="btn" style="width: 100%; padding: 0.8rem; font-size: 1rem;">Create account</button>
      </form>

      <div style="margin-top: 1.2rem; text-align: center; font-size: 0.85rem; color: var(--dim);">
        <span id="authSwitchText">Already have an account?</span>
        <a href="#" id="authSwitchLink" onclick="toggleAuthMode(event)" style="color: var(--gold); font-weight: 700; margin-left: 0.3rem;">Sign in</a>
      </div>
    </div>
  </div>
</main>

<script>
let currentMode = 'register';

function showAuthModal(mode) {
  currentMode = mode;
  updateFormUI();
  document.getElementById('authContainer').scrollIntoView({ behavior: 'smooth' });
}

function toggleAuthMode(e) {
  e.preventDefault();
  currentMode = currentMode === 'register' ? 'login' : 'register';
  updateFormUI();
}

function updateFormUI() {
  const title = document.getElementById('authTitle');
  const nameField = document.getElementById('nameField');
  const submitBtn = document.getElementById('submitBtn');
  const switchText = document.getElementById('authSwitchText');
  const switchLink = document.getElementById('authSwitchLink');
  const errorBox = document.getElementById('authError');

  errorBox.style.display = 'none';

  if (currentMode === 'register') {
    title.innerText = 'Create your account';
    nameField.style.display = 'block';
    submitBtn.innerText = 'Create account';
    switchText.innerText = 'Already have an account?';
    switchLink.innerText = 'Sign in';
  } else {
    title.innerText = 'Sign in to Share Option';
    nameField.style.display = 'none';
    submitBtn.innerText = 'Sign in';
    switchText.innerText = "Don't have an account?";
    switchLink.innerText = 'Create account';
  }
}

async function handleAuthSubmit(event) {
  event.preventDefault();
  
  const submitBtn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('authError');
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const fullName = document.getElementById('fullName').value;

  submitBtn.disabled = true;
  submitBtn.innerText = 'Processing...';
  errorBox.style.display = 'none';

  const endpoint = currentMode === 'register' ? '/api/register' : '/api/login';
  const payload = currentMode === 'register' ? { email, password, fullName } : { email, password };

  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (response.ok) {
      alert(currentMode === 'register' ? 'Account created successfully!' : 'Signed in successfully!');
      if (data.token) localStorage.setItem('token', data.token);
      window.location.reload();
    } else {
      throw new Error(data.message || data.detail || 'Authentication failed.');
    }
  } catch (err) {
    errorBox.innerText = err.message;
    errorBox.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerText = currentMode === 'register' ? 'Create account' : 'Sign in';
  }
}
</script>

</body>
</html>
